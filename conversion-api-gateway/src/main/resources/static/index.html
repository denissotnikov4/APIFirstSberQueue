<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>XML to JSON Converter</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
</head>
<body>
<main>
    <header class="page-header">
        <h1>XML <span aria-hidden="true">→</span><span class="sr-only">to </span> JSON</h1>
        <p>Submit an XML document and track its conversion below.</p>
    </header>

    <section class="panel" aria-labelledby="xml-label">
        <form id="conversion-form">
            <label id="xml-label" for="xml">XML input</label>
            <textarea id="xml" name="xml" spellcheck="false" required><note><to>Alice</to><body>Hello</body></note></textarea>
            <div class="actions">
                <button type="submit" id="convert" class="primary">Convert</button>
                <button type="button" id="load-example">Load example</button>
            </div>
        </form>
    </section>

    <section class="panel" aria-labelledby="history-heading">
        <h2 id="history-heading">Recent conversions</h2>
        <div class="table-scroll">
            <table>
                <thead>
                <tr><th scope="col">ID</th><th scope="col">Status</th><th scope="col">Submitted</th><th scope="col">Result</th></tr>
                </thead>
                <tbody id="conversions">
                <tr id="empty-state"><td colspan="4">No conversions yet.</td></tr>
                </tbody>
            </table>
        </div>
    </section>

    <p id="error" class="error" role="alert" hidden></p>

    <dialog id="result-dialog" aria-labelledby="result-heading">
        <div class="dialog-header">
            <h2 id="result-heading">JSON result</h2>
            <form method="dialog"><button>Close</button></form>
        </div>
        <pre id="result"></pre>
    </dialog>
</main>
</body>
</html>
