spring:
  application:
    name: xml-to-json-converter
  rabbitmq:
    host: localhost
    username: admin
    password: admin
    connection-timeout: 2s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1

converter:
  processing-delay-ms: 2500
  rabbit:
    exchange: converter.exchange
    requests-queue: xml.conversion.requests
    results-queue: json.conversion.results
    requested-key: conversion.requested
    completed-key: conversion.completed
    publish-confirm-timeout: 5s
